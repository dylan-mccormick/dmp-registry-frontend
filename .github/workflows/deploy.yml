name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=https://api.registry.mnmzc.us.to
          tags: ghcr.io/${{ secrets.GHCR_USERNAME }}/dmp-frontend:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: 159.65.33.140
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /srv/dmp-registry
            docker compose pull frontend
            docker compose up -d frontend